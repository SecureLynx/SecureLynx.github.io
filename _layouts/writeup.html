---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%B %-d, %Y" }}
      {% if page.cvss_score %} · Highest CVSS: {{ page.cvss_score }}{% endif %}
    </p>
    {% if page.tags %}
    <p class="post-tags">
      {% for tag in page.tags %}<code>{{ tag }}</code> {% endfor %}
    </p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
